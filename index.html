<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Build: Network Topologies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      user-select: none;
      background-color: #f8fafc;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .node-active {
      ring: 4px solid #3b82f6;
      transform: scale(1.05);
    }
    /* Lock layout into side-by-side mode inside Canvas iframes */
    .app-container {
      display: flex;
      flex-direction: row;
      gap: 1rem;
      height: 600px;
      max-height: 600px;
    }
    .sidebar-panel {
      width: 280px;
      min-width: 280px;
      overflow-y: auto;
      max-height: 100%;
    }
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    canvas {
      touch-action: none;
      background-color: #ffffff;
    }
  </style>
</head>
<body class="p-3 text-slate-800">
  <div class="max-w-7xl mx-auto">
    
    <!-- Top Navigation / Tabs -->
    <div class="flex items-center justify-between mb-3 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
      <div class="flex gap-2" id="level-tabs">
        <!-- Generated by JS -->
      </div>
      <div class="text-xs font-semibold px-3 py-1 bg-slate-100 text-slate-600 rounded-full">
        Low-Stress Mode Enabled
      </div>
    </div>

    <!-- App Main Body (Guaranteed 2-Column Side-by-Side Layout) -->
    <div class="app-container">
      
      <!-- Left Panel: Checklist & Facts -->
      <div class="sidebar-panel space-y-3 pr-1">
        
        <!-- Header Info -->
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded-full" id="level-badge">Level 1 of 4</span>
            <span class="text-xs text-slate-400">Take your time</span>
          </div>
          <h2 class="text-base font-bold text-slate-800 mb-1" id="topology-title">Star Topology</h2>
          <p class="text-xs text-slate-600 leading-relaxed" id="topology-desc">Loading...</p>
        </div>

        <!-- Checklist -->
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1">
            <i data-lucide="check-square" class="w-3.5 h-3.5"></i> Tasks Checklist
          </h3>
          <ul class="space-y-1.5 text-xs text-slate-700" id="task-list">
            <!-- Dynamic tasks -->
          </ul>
        </div>

        <!-- Hint Box -->
        <div class="bg-sky-50 border border-sky-200 text-sky-800 p-2.5 rounded-xl text-xs flex gap-2 items-start">
          <i data-lucide="info" class="w-4 h-4 shrink-0 text-sky-600 mt-0.5"></i>
          <span id="hint-text">Click on one node, then click another node to connect them with a cable.</span>
        </div>

        <!-- Facts Card -->
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-xs space-y-1.5">
          <div class="font-bold text-slate-700 flex items-center gap-1">
            <i data-lucide="book-open" class="w-3.5 h-3.5 text-sky-600"></i> Topology Fact Box
          </div>
          <p><strong class="text-slate-800">Key Fact:</strong> <span id="fact-key" class="text-slate-600">--</span></p>
          <p><strong class="text-emerald-700">Pro:</strong> <span id="fact-pro" class="text-slate-600">--</span></p>
          <p><strong class="text-rose-700">Con:</strong> <span id="fact-con" class="text-slate-600">--</span></p>
        </div>

      </div>

      <!-- Right Panel: Canvas & Controls -->
      <div class="main-panel">
        
        <!-- Action Buttons Bar -->
        <div class="flex items-center justify-between mb-2 gap-2">
          <div class="flex gap-2">
            <button id="btn-check" class="bg-sky-700 hover:bg-sky-800 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-colors">
              <i data-lucide="check-circle" class="w-4 h-4"></i> Check My Network
            </button>
            <button id="btn-simulate" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-colors">
              <i data-lucide="send" class="w-4 h-4"></i> Simulate Data Packets
            </button>
          </div>
          <div class="flex gap-2">
            <button id="btn-mode-cable" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-2.5 py-2 rounded-lg flex items-center gap-1 transition-colors">
              <i data-lucide="scissors" class="w-3.5 h-3.5"></i> Remove Cables
            </button>
            <button id="btn-reset" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold px-2.5 py-2 rounded-lg flex items-center gap-1 transition-colors">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Level
            </button>
          </div>
        </div>

        <!-- Canvas Workspace -->
        <div class="relative flex-1 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden" id="canvas-container">
          <canvas id="networkCanvas" class="w-full h-full block"></canvas>
          <div id="feedback-overlay" class="absolute bottom-3 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg text-xs font-bold shadow-lg transition-all duration-300 hidden"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Topology Levels Data
    const levels = [
      {
        id: 'star',
        title: 'Star Topology',
        desc: 'In a Star network, every device connects directly to a central Switch. If one computer cable breaks, other computers keep working!',
        keyFact: 'Star topologies are used in most modern schools and homes!',
        pro: 'Easy to add new devices; if one cable breaks, the rest stay online.',
        con: 'If the central switch fails, the whole network goes down.',
        nodes: [
          { id: 'switch', label: 'Central Switch', type: 'switch', x: 0.5, y: 0.5 },
          { id: 'a', label: 'Computer A', type: 'pc', x: 0.25, y: 0.2 },
          { id: 'b', label: 'Computer B', type: 'pc', x: 0.75, y: 0.2 },
          { id: 'c', label: 'Computer C', type: 'pc', x: 0.25, y: 0.8 },
          { id: 'd', label: 'Computer D', type: 'pc', x: 0.75, y: 0.8 }
        ],
        requiredConnections: [
          ['switch', 'a'], ['switch', 'b'], ['switch', 'c'], ['switch', 'd']
        ],
        tasks: [
          { text: 'Connect Computer A to Central Switch', pair: ['switch', 'a'] },
          { text: 'Connect Computer B to Central Switch', pair: ['switch', 'b'] },
          { text: 'Connect Computer C to Central Switch', pair: ['switch', 'c'] },
          { text: 'Connect Computer D to Central Switch', pair: ['switch', 'd'] }
        ]
      },
      {
        id: 'bus',
        title: 'Bus Topology',
        desc: 'In a Bus network, all devices connect to one main Central Cable (backbone). Data travels along this single line.',
        keyFact: 'An older type of topology, often used in early Ethernet setups.',
        pro: 'Uses very little cable, cheap and simple to set up for small rooms.',
        con: 'If the main backbone cable snaps, the whole network breaks!',
        nodes: [
          { id: 'b1', label: 'Backbone Start', type: 'backbone', x: 0.15, y: 0.5 },
          { id: 'b2', label: 'Backbone End', type: 'backbone', x: 0.85, y: 0.5 },
          { id: 'a', label: 'Computer A', type: 'pc', x: 0.28, y: 0.22 },
          { id: 'b', label: 'Computer B', type: 'pc', x: 0.50, y: 0.22 },
          { id: 'c', label: 'Computer C', type: 'pc', x: 0.72, y: 0.22 },
          { id: 'd', label: 'Computer D', type: 'pc', x: 0.50, y: 0.78 }
        ],
        requiredConnections: [
          ['b1', 'b2'], ['a', 'b1'], ['b', 'b1'], ['c', 'b1'], ['d', 'b1']
        ],
        tasks: [
          { text: 'Connect Backbone Start to End', pair: ['b1', 'b2'] },
          { text: 'Connect Computer A to Main Cable', pair: ['a', 'b1'] },
          { text: 'Connect Computer B to Main Cable', pair: ['b', 'b1'] },
          { text: 'Connect Computer C to Main Cable', pair: ['c', 'b1'] },
          { text: 'Connect Computer D to Main Cable', pair: ['d', 'b1'] }
        ]
      },
      {
        id: 'ring',
        title: 'Ring Topology',
        desc: 'In a Ring network, each device connects to exactly TWO neighbors, forming a complete loop. Data flows in one direction around the ring.',
        keyFact: 'Data travels in tokens around the circle so no collisions happen!',
        pro: 'Handles heavy network traffic smoothly without collisions.',
        con: 'If any single computer or wire breaks, the entire ring is disrupted.',
        nodes: [
          { id: 'a', label: 'Node A', type: 'pc', x: 0.5, y: 0.18 },
          { id: 'b', label: 'Node B', type: 'pc', x: 0.82, y: 0.5 },
          { id: 'c', label: 'Node C', type: 'pc', x: 0.5, y: 0.82 },
          { id: 'd', label: 'Node D', type: 'pc', x: 0.18, y: 0.5 }
        ],
        requiredConnections: [
          ['a', 'b'], ['b', 'c'], ['c', 'd'], ['d', 'a']
        ],
        tasks: [
          { text: 'Connect Node A to Node B', pair: ['a', 'b'] },
          { text: 'Connect Node B to Node C', pair: ['b', 'c'] },
          { text: 'Connect Node C to Node D', pair: ['c', 'd'] },
          { text: 'Connect Node D back to Node A', pair: ['d', 'a'] }
        ]
      },
      {
        id: 'mesh',
        title: 'Mesh Topology',
        desc: 'In a Full Mesh network, EVERY device is directly connected to EVERY other device. This provides ultimate backup connections (redundancy).',
        keyFact: 'Used in critical systems like air traffic control and military installations.',
        pro: 'Extremely reliable! If one wire breaks, data instantly finds another path.',
        con: 'Very expensive and difficult to manage due to so many cables.',
        nodes: [
          { id: 'a', label: 'Server A', type: 'pc', x: 0.25, y: 0.25 },
          { id: 'b', label: 'Server B', type: 'pc', x: 0.75, y: 0.25 },
          { id: 'c', label: 'Server C', type: 'pc', x: 0.75, y: 0.75 },
          { id: 'd', label: 'Server D', type: 'pc', x: 0.25, y: 0.75 }
        ],
        requiredConnections: [
          ['a', 'b'], ['a', 'c'], ['a', 'd'], ['b', 'c'], ['b', 'd'], ['c', 'd']
        ],
        tasks: [
          { text: 'Connect A to B, C, and D', pair: ['a', 'b'] },
          { text: 'Connect B to C and D', pair: ['b', 'c'] },
          { text: 'Connect C to D', pair: ['c', 'd'] }
        ]
      }
    ];

    let currentLevelIdx = 0;
    let connections = [];
    let selectedNodeId = null;
    let removeCableMode = false;
    let packets = [];
    let animFrame = null;

    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    function initLevel(idx) {
      currentLevelIdx = idx;
      connections = [];
      selectedNodeId = null;
      removeCableMode = false;
      packets = [];
      
      const level = levels[idx];
      document.getElementById('topology-title').innerText = level.title;
      document.getElementById('topology-desc').innerText = level.desc;
      document.getElementById('level-badge').innerText = `Level ${idx + 1} of 4`;
      document.getElementById('fact-key').innerText = level.keyFact;
      document.getElementById('fact-pro').innerText = level.pro;
      document.getElementById('fact-con').innerText = level.con;

      renderTabs();
      renderTasks();
      hideFeedback();
      resizeCanvas();
    }

    function renderTabs() {
      const nav = document.getElementById('level-tabs');
      nav.innerHTML = levels.map((lvl, i) => `
        <button onclick="initLevel(${i})" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${
          i === currentLevelIdx 
            ? 'bg-sky-700 text-white shadow-sm' 
            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
        }">
          ${lvl.title.replace(' Topology', '')}
        </button>
      `).join('');
    }

    function renderTasks() {
      const level = levels[currentLevelIdx];
      const list = document.getElementById('task-list');
      list.innerHTML = level.tasks.map(task => {
        const isDone = isConnected(task.pair[0], task.pair[1]);
        return `
          <li class="flex items-center gap-2 ${isDone ? 'text-emerald-700 font-medium' : 'text-slate-600'}">
            <i data-lucide="${isDone ? 'check-circle-2' : 'circle'}" class="w-3.5 h-3.5 ${isDone ? 'text-emerald-600' : 'text-slate-300'}"></i>
            <span>${task.text}</span>
          </li>
        `;
      }).join('');
      lucide.createIcons();
    }

    function isConnected(id1, id2) {
      return connections.some(c => (c[0] === id1 && c[1] === id2) || (c[0] === id2 && c[1] === id1));
    }

    function getNodeCoords(node) {
      return {
        x: node.x * canvas.width,
        y: node.y * canvas.height
      };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const level = levels[currentLevelIdx];

      // Special drawing for Bus Backbone Line
      if (level.id === 'bus') {
        const b1 = level.nodes.find(n => n.id === 'b1');
        const b2 = level.nodes.find(n => n.id === 'b2');
        if (b1 && b2) {
          const p1 = getNodeCoords(b1);
          const p2 = getNodeCoords(b2);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineWidth = 10;
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineCap = 'round';
          ctx.stroke();

          if (isConnected('b1', 'b2')) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#0284c7';
            ctx.stroke();
          }
        }
      }

      // Draw Connections (Cables)
      connections.forEach(([id1, id2]) => {
        const n1 = level.nodes.find(n => n.id === id1);
        const n2 = level.nodes.find(n => n.id === id2);
        if (n1 && n2) {
          const p1 = getNodeCoords(n1);
          const p2 = getNodeCoords(n2);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#0284c7';
          ctx.stroke();
        }
      });

      // Draw Packets (Animations)
      packets.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#10b981';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      });

      // Draw Nodes
      level.nodes.forEach(node => {
        const { x, y } = getNodeCoords(node);
        const isSelected = selectedNodeId === node.id;

        // Active Ring Highlight
        if (isSelected) {
          ctx.beginPath();
          ctx.arc(x, y, 26, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#0284c7';
          ctx.stroke();
        }

        // Node Box Base
        ctx.beginPath();
        if (node.type === 'switch') {
          ctx.arc(x, y, 20, 0, Math.PI * 2);
          ctx.fillStyle = '#e0f2fe';
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#0284c7';
          ctx.stroke();
        } else if (node.type === 'backbone') {
          ctx.arc(x, y, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#6474
