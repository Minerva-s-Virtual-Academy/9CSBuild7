<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build: Network Topologies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      user-select: none;
    }
    .layout-wrapper {
      display: flex;
      flex-direction: row;
      gap: 12px;
      height: 520px;
    }
    .sidebar {
      width: 270px;
      min-width: 270px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .canvas-container {
      flex: 1;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Tabs -->
  <div class="flex items-center justify-between mb-2 bg-white p-2 rounded-lg border border-slate-200">
    <div id="tabs-container" class="flex gap-2"></div>
    <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-500 rounded-full">Low-Stress Mode</span>
  </div>

  <!-- Main Side-by-Side Layout -->
  <div class="layout-wrapper">
    
    <!-- Left Sidebar -->
    <div class="sidebar">
      
      <!-- Info Header -->
      <div class="bg-white p-3 rounded-lg border border-slate-200">
        <div class="flex justify-between items-center mb-1">
          <span id="level-badge" class="text-xs font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded-full">Level 1 of 4</span>
          <span class="text-xs text-slate-400">Take your time</span>
        </div>
        <h2 id="topo-title" class="text-base font-bold text-slate-800">--</h2>
        <p id="topo-desc" class="text-xs text-slate-600 mt-1 leading-snug">--</p>
      </div>

      <!-- Checklist -->
      <div class="bg-white p-3 rounded-lg border border-slate-200">
        <div class="text-xs font-bold text-slate-500 uppercase mb-2">📋 Tasks Checklist</div>
        <ul id="task-list" class="space-y-1.5 text-xs"></ul>
      </div>

      <!-- Hint -->
      <div class="bg-sky-50 border border-sky-200 text-sky-800 p-2.5 rounded-lg text-xs">
        💡 <strong>How to connect:</strong> Click one device, then click another to attach a cable.
      </div>

      <!-- Facts -->
      <div class="bg-white p-3 rounded-lg border border-slate-200 text-xs space-y-1">
        <div class="font-bold text-slate-700">📖 Topology Facts</div>
        <p><strong>Key Fact:</strong> <span id="fact-key" class="text-slate-600">--</span></p>
        <p><strong class="text-emerald-700">Pro:</strong> <span id="fact-pro" class="text-slate-600">--</span></p>
        <p><strong class="text-rose-700">Con:</strong> <span id="fact-con" class="text-slate-600">--</span></p>
      </div>

    </div>

    <!-- Main Workspace -->
    <div class="main-workspace">
      
      <!-- Top Action Controls -->
      <div class="flex justify-between items-center gap-2">
        <div class="flex gap-2">
          <button id="btn-check" class="bg-sky-700 hover:bg-sky-800 text-white text-xs font-semibold px-3 py-1.5 rounded shadow-sm">
            ✓ Check My Network
          </button>
          <button id="btn-sim" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded shadow-sm">
            ✈ Simulate Packets
          </button>
        </div>
        <div class="flex gap-2">
          <button id="btn-remove" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-2.5 py-1.5 rounded">
            ✂ Remove Cables
          </button>
          <button id="btn-reset" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold px-2.5 py-1.5 rounded">
            ↺ Reset
          </button>
        </div>
      </div>

      <!-- Canvas Box -->
      <div class="canvas-container" id="canvas-holder">
        <canvas id="networkCanvas"></canvas>
        <div id="toast" class="absolute bottom-3 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded text-xs font-bold shadow-md hidden"></div>
      </div>

    </div>
  </div>

  <script>
    const levels = [
      {
        title: 'Star Topology',
        desc: 'Every device connects directly to a central Switch. If one cable breaks, other devices stay online!',
        keyFact: 'Used in almost all modern schools and home Wi-Fi routers.',
        pro: 'Easy to add new computers without stopping the network.',
        con: 'If the central switch breaks, the entire network stops working.',
        nodes: [
          { id: 'sw', label: 'Central Switch', type: 'switch', x: 0.5, y: 0.5 },
          { id: 'a', label: 'Computer A', type: 'pc', x: 0.22, y: 0.22 },
          { id: 'b', label: 'Computer B', type: 'pc', x: 0.78, y: 0.22 },
          { id: 'c', label: 'Computer C', type: 'pc', x: 0.22, y: 0.78 },
          { id: 'd', label: 'Computer D', type: 'pc', x: 0.78, y: 0.78 }
        ],
        required: [['sw','a'], ['sw','b'], ['sw','c'], ['sw','d']],
        tasks: ['Connect Computer A to Switch', 'Connect Computer B to Switch', 'Connect Computer C to Switch', 'Connect Computer D to Switch']
      },
      {
        title: 'Bus Topology',
        desc: 'All devices connect to one main Central Cable (backbone). Data travels along this single wire.',
        keyFact: 'Common in early computer networks because it was cheap.',
        pro: 'Requires very little wiring compared to other topologies.',
        con: 'If the main backbone cable breaks, all computers lose connection.',
        nodes: [
          { id: 'b1', label: 'Start Cable', type: 'backbone', x: 0.15, y: 0.5 },
          { id: 'b2', label: 'End Cable', type: 'backbone', x: 0.85, y: 0.5 },
          { id: 'a', label: 'Computer A', type: 'pc', x: 0.3, y: 0.22 },
          { id: 'b', label: 'Computer B', type: 'pc', x: 0.7, y: 0.22 },
          { id: 'c', label: 'Computer C', type: 'pc', x: 0.3, y: 0.78 },
          { id: 'd', label: 'Computer D', type: 'pc', x: 0.7, y: 0.78 }
        ],
        required: [['b1','b2'], ['a','b1'], ['b','b1'], ['c','b1'], ['d','b1']],
        tasks: ['Connect Cable Start to End', 'Connect Computer A to Main Cable', 'Connect Computer B to Main Cable', 'Connect Computer C to Main Cable', 'Connect Computer D to Main Cable']
      },
      {
        title: 'Ring Topology',
        desc: 'Each device connects to exactly TWO neighbors, forming a closed loop. Data travels in one direction.',
        keyFact: 'Data travels in tokens so devices don’t send data at the exact same time.',
        pro: 'Handles high data traffic without network collisions.',
        con: 'If any single wire or computer fails, the entire ring goes down.',
        nodes: [
          { id: 'a', label: 'Node A', type: 'pc', x: 0.5, y: 0.18 },
          { id: 'b', label: 'Node B', type: 'pc', x: 0.82, y: 0.5 },
          { id: 'c', label: 'Node C', type: 'pc', x: 0.5, y: 0.82 },
          { id: 'd', label: 'Node D', type: 'pc', x: 0.18, y: 0.5 }
        ],
        required: [['a','b'], ['b','c'], ['c','d'], ['d','a']],
        tasks: ['Connect Node A to B', 'Connect Node B to C', 'Connect Node C to D', 'Connect Node D to A']
      },
      {
        title: 'Mesh Topology',
        desc: 'Every device connects directly to EVERY other device, creating lots of backup routes (redundancy).',
        keyFact: 'Used in high-security systems like airports and nuclear power stations.',
        pro: 'Super reliable! If one wire breaks, data immediately takes another path.',
        con: 'Extremely expensive due to the large amount of cabling needed.',
        nodes: [
          { id: 'a', label: 'Server A', type: 'pc', x: 0.25, y: 0.25 },
          { id: 'b', label: 'Server B', type: 'pc', x: 0.75, y: 0.25 },
          { id: 'c', label: 'Server C', type: 'pc', x: 0.75, y: 0.75 },
          { id: 'd', label: 'Server D', type: 'pc', x: 0.25, y: 0.75 }
        ],
        required: [['a','b'], ['a','c'], ['a','d'], ['b','c'], ['b','d'], ['c','d']],
        tasks: ['Connect Server A to B, C, and D', 'Connect Server B to C and D', 'Connect Server C to D']
      }
    ];

    let activeLevel = 0;
    let connections = [];
    let selectedId = null;
    let removeMode = false;
    let packets = [];
    let animId = null;

    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    const holder = document.getElementById('canvas-holder');

    function resize() {
      canvas.width = holder.clientWidth;
      canvas.height = holder.clientHeight;
      draw();
    }
    window.addEventListener('resize', resize);

    function loadLevel(idx) {
      activeLevel = idx;
      connections = [];
      selectedId = null;
      removeMode = false;
      packets = [];
      if (animId) cancelAnimationFrame(animId);

      const lvl = levels[idx];
      document.getElementById('level-badge').innerText = `Level ${idx + 1} of 4`;
      document.getElementById('topo-title').innerText = lvl.title;
      document.getElementById('topo-desc').innerText = lvl.desc;
      document.getElementById('fact-key').innerText = lvl.keyFact;
      document.getElementById('fact-pro').innerText = lvl.pro;
      document.getElementById('fact-con').innerText = lvl.con;

      renderTabs();
      renderTasks();
      hideToast();
      resize();
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = levels.map((l, i) => `
        <button onclick="loadLevel(${i})" class="px-3 py-1 text-xs font-bold rounded ${
          i === activeLevel ? 'bg-sky-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
        }">${l.title.replace(' Topology','')}</button>
      `).join('');
    }

    function renderTasks() {
      const lvl = levels[activeLevel];
      const list = document.getElementById('task-list');
      list.innerHTML = lvl.tasks.map((t, i) => {
        const req = lvl.required[i];
        const done = req && isConn(req[0], req[1]);
        return `
          <li class="flex items-center gap-1.5 ${done ? 'text-emerald-700 font-semibold' : 'text-slate-600'}">
            <span>${done ? '✓' : '○'}</span>
            <span>${t}</span>
          </li>
        `;
      }).join('');
    }

    function isConn(id1, id2) {
      return connections.some(c => (c[0] === id1 && c[1] === id2) || (c[0] === id2 && c[1] === id1));
    }

    function getCoords(n) {
      return { x: n.x * canvas.width, y: n.y * canvas.height };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const lvl = levels[activeLevel];

      // Draw Bus Line
      if (lvl.title.includes('Bus')) {
        const b1 = lvl.nodes.find(n => n.id === 'b1');
        const b2 = lvl.nodes.find(n => n.id === 'b2');
        if (b1 && b2) {
          const p1 = getCoords(b1);
          const p2 = getCoords(b2);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineWidth = 8;
          ctx.strokeStyle = '#cbd5e1';
          ctx.stroke();

          if (isConn('b1', 'b2')) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#0284c7';
            ctx.stroke();
          }
        }
      }

      // Draw Connections
      connections.forEach(([i1, i2]) => {
        const n1 = lvl.nodes.find(n => n.id === i1);
        const n2 = lvl.nodes.find(n => n.id === i2);
        if (n1 && n2) {
